<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cổng thông tin - Trung tâm ngoại ngữ Aplus</title>
  <style>
    :root { --primary-green: #03522a; --bg-gray: #f4f6f8; }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-gray); margin: 0; padding: 20px 10px; display: flex; justify-content: center; min-height: 100vh; }
    
    .wrapper { width: 100%; max-width: 700px; margin-top: 20px; }
    
    .header-banner { 
      background-color: var(--primary-green); 
      color: white; 
      text-align: center; 
      padding: 30px 20px 50px 20px; 
      border-radius: 16px 16px 0 0; 
    }
    .header-banner h1 { margin: 0; font-size: 24px; font-weight: 700; }
    .header-banner p { margin: 8px 0 0 0; font-size: 13px; opacity: 0.9; letter-spacing: 0.5px; }
    
    .card-body { 
      background: white; 
      border-radius: 20px; 
      padding: 35px 25px; 
      margin-top: -20px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
    }
    
    .menu-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); 
      gap: 20px; 
      margin-top: 25px; 
    }
    
    .menu-card { 
      background: #fafafa; 
      border: 1px solid #e0e0e0; 
      padding: 25px 20px; 
      border-radius: 14px; 
      text-decoration: none; 
      color: #333; 
      text-align: center; 
      transition: all 0.25s ease; 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .menu-card:hover { 
      border-color: var(--primary-green); 
      transform: translateY(-4px); 
      box-shadow: 0 6px 18px rgba(3, 82, 42, 0.12); 
      background: #ffffff;
    }
    .menu-card h3 { margin: 0 0 8px 0; color: var(--primary-green); font-size: 19px; }
    .menu-card p { margin: 0; font-size: 13px; color: #666; line-height: 1.4; }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="header-banner">
      <h1>Trung tâm ngoại ngữ Aplus</h1>
      <p>CỔNG THÔNG TIN VÀ BÁO CÁO VẬN HÀNH</p>
    </div>

    <div class="card-body">
      <h2 style="text-align: center; color: #333; font-size: 18px; margin-top: 0;">Vui lòng chọn chức năng báo cáo</h2>
      
      <div class="menu-grid">
        <!-- Nút 1: Chuyển sang trang Điểm danh của Giáo viên -->
        <a href="diem_danh.html" class="menu-card">
          <h3>📋 Báo cáo Điểm danh</h3>
          <p>Dành cho Giáo viên báo cáo tình hình giảng dạy & sĩ số lớp học</p>
        </a>

        <!-- Nút 2: Chuyển sang trang Báo cáo Quản lý -->
        <a href="quan_ly.html" class="menu-card">
          <h3>📊 Báo cáo Quản lý</h3>
          <p>Dành cho Nhân sự/Quản lý báo cáo tài chính & công việc trong ngày</p>
        </a>
      </div>
    </div>
  </div>

</body>
</html>
