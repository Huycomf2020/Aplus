<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cổng thông tin - Trung tâm ngoại ngữ Aplus</title>
  <style>
    :root { --primary-green: #03522a; --bg-gray: #f4f6f8; }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-gray); margin: 0; padding: 20px 10px; display: flex; justify-content: center; min-height: 100vh; }
    .wrapper { width: 100%; max-width: 700px; margin-top: 20px; }
    .header-banner { background-color: var(--primary-green); color: white; text-align: center; padding: 30px 15px; border-radius: 16px 16px 0 0; }
    .header-banner h1 { margin: 0; font-size: 24px; font-weight: 700; }
    .header-banner p { margin: 8px 0 0 0; font-size: 13px; opacity: 0.9; }
    .card-body { background: white; border-radius: 20px; padding: 30px 25px; margin-top: -15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
    .menu-card { background: #fafafa; border: 1px solid #e0e0e0; padding: 20px; border-radius: 12px; text-decoration: none; color: #333; text-align: center; transition: all 0.2s ease; }
    .menu-card:hover { border-color: var(--primary-green); transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
    .menu-card h3 { margin: 0 0 8px 0; color: var(--primary-green); font-size: 18px; }
    .menu-card p { margin: 0; font-size: 13px; color: #666; }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="header-banner">
      <h1>Trung tâm ngoại ngữ Aplus</h1>
      <p>CỔNG THÔNG TIN VÀ QUẢN LÝ DẠY HỌC</p>
    </div>

    <div class="card-body">
      <h2 style="text-align: center; color: #444; font-size: 18px; margin-top: 0;">Chọn chức năng</h2>
      
      <div class="menu-grid">
        <!-- Nút chuyển sang trang Điểm danh -->
        <a href="diem_danh.html" class="menu-card">
          <h3>📋 Điểm danh</h3>
          <p>Báo cáo giảng dạy & Điểm danh lớp học</p>
        </a>

        <!-- Nút trang Quản lý (Dành cho tính năng sau) -->
        <a href="#" class="menu-card" onclick="alert('Tính năng Quản lý đang được phát triển!'); return false;">
          <h3>📊 Quản lý</h3>
          <p>Xem tổng hợp dữ liệu báo cáo (Sắp ra mắt)</p>
        </a>
      </div>
    </div>
  </div>

</body>
</html>
